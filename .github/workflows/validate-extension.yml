name: Validate Extension

# Registry source of truth = GitHub Releases
#   GET /repos/MobileStudio-AndroidIDE/MobileStudio-Extensions/releases
# - Only .msext packages are allowed (.zip/.apk/.aab/.jar fail the run)
# - repository.json / registry.json must NOT exist (legacy index is removed)
# - metadata + security checks run on every PR/push and on app-triggered dispatch

on:
  pull_request:
    paths:
      - "extensions/**"
      - "schema/**"
      - "scripts/**"
      - ".github/workflows/validate-extension.yml"
  push:
    branches: [main]
    paths:
      - "extensions/**"
      - "schema/**"
      - "scripts/**"
      - ".github/workflows/validate-extension.yml"
  workflow_dispatch:
    inputs:
      ext_id:
        description: "Extension ID (e.g. com.mobilestudio.lua)"
        required: true
      version:
        description: "Extension version (e.g. 1.0.0)"
        required: true
      download_url:
        description: "Direct .msext download URL (optional; falls back to the Release asset)"
        required: false

# Queue: one run per extension id at a time. Newer queued runs for the SAME
# extension replace older pending ones; different extensions run in parallel
# (the app-side ExtensionUploadQueue enforces the global FIFO max-5 policy).
concurrency:
  group: scan-${{ github.event.inputs.ext_id || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate extensions (registry = GitHub Releases)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install jsonschema

      - name: Registry source-of-truth guard (legacy index files rejected)
        run: |
          set -euo pipefail
          BAD=""
          for f in repository.json registry.json; do
            if [ -f "$f" ]; then BAD="$BAD $f"; fi
          done
          if [ -n "$BAD" ]; then
            {
              echo "### Legacy registry index file(s) found:$BAD"
              echo "The registry source of truth is GitHub Releases - delete repository.json/registry.json."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "OK: no legacy registry index files (source of truth = GitHub Releases)" >> "$GITHUB_STEP_SUMMARY"

      - name: Reject non-.msext package files in the tree
        run: |
          set -euo pipefail
          BAD=$(find . -type f \( -iname '*.zip' -o -iname '*.apk' -o -iname '*.aab' -o -iname '*.jar' \) \
                -not -path './.git/*' -not -path './scan-work/*' || true)
          if [ -n "$BAD" ]; then
            {
              echo "### Non-.msext package files are not allowed in the repository"
              echo '```'
              echo "$BAD"
              echo '```'
              echo "Packages are distributed exclusively as GitHub Release .msext assets."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "OK: no .zip/.apk/.aab/.jar files in the tree" >> "$GITHUB_STEP_SUMMARY"

      - name: Security-scan any .msext committed to the tree
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r -d '' f; do
            found=1
            echo "Scanning $f"
            python scripts/security_scan.py "$f"
          done < <(find . -type f -iname '*.msext' -not -path './.git/*' -not -path './scan-work/*' -print0)
          if [ "$found" -eq 0 ]; then
            echo "OK: no .msext files in the tree (packages exist only as Release assets)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Metadata validation (JSON Schema, SemVer, ID, sizes, duplicates)
        run: |
          set +e
          OUT=$(python scripts/validate.py 2>&1)
          CODE=$?
          set -e
          echo "$OUT"
          {
            echo "### Metadata validation (scripts/validate.py)"
            echo '```'
            echo "$OUT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $CODE

  security-scan:
    name: Security scan
    runs-on: ubuntu-latest
    needs: validate
    outputs:
      status: ${{ steps.scan.outputs.status }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve scan target
        id: resolve
        run: |
          EXT_ID="${{ github.event.inputs.ext_id }}"
          VERSION="${{ github.event.inputs.version }}"
          if [ -n "$EXT_ID" ]; then
            # App-triggered scan: download the .msext release asset
            # Convention: tag/asset = <extension-id>-v<version>
            URL="${{ github.event.inputs.download_url }}"
            if [ -z "$URL" ]; then
              URL="https://github.com/${{ github.repository }}/releases/download/${EXT_ID}-v${VERSION}/${EXT_ID}-v${VERSION}.msext"
            fi
            mkdir -p scan-work
            curl -fSL --retry 3 -o scan-work/package.msext "$URL" || echo "download-failed=1" >> "$GITHUB_OUTPUT"
            echo "target=scan-work/package.msext" >> "$GITHUB_OUTPUT"
          else
            # PR/push scan: scan every extension source folder
            echo "target=extensions" >> "$GITHUB_OUTPUT"
          fi

      - name: Security scan (static + archive + scripts + manifest + integrity)
        id: scan
        run: |
          TARGET="${{ steps.resolve.outputs.target }}"
          if [ "$TARGET" = "scan-work/package.msext" ] && grep -q "download-failed" <<< "$(cat $GITHUB_OUTPUT || true)"; then
            echo "status=Failed" >> "$GITHUB_OUTPUT"
            echo "### ❌ Security scan: package download failed" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          mkdir -p scan-results
          set +e
          STATUS="Passed"
          if [ "$TARGET" = "scan-work/package.msext" ]; then
            # App-triggered: single downloaded .msext package
            python scripts/security_scan.py "$TARGET" \
              --ext-id "${{ github.event.inputs.ext_id }}" \
              --version "${{ github.event.inputs.version }}" \
              --out scan-results/scan-result.json \
              --summary scan-results/scan-summary.md
            CODE=$?
            if [ $CODE -ne 0 ]; then STATUS="Failed"; fi
            if grep -q '"status": "Warning"' scan-results/scan-result.json 2>/dev/null; then STATUS="Warning"; fi
            if [ -f scan-results/scan-summary.md ]; then
              cat scan-results/scan-summary.md >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            # PR/push: every extensions/<id>/ folder is scanned as its own unit
            shopt -s nullglob
            folders=(extensions/*/)
            if [ ${#folders[@]} -eq 0 ]; then
              echo "No extension folders to scan" >> "$GITHUB_STEP_SUMMARY"
              echo '{"status": "Passed", "target": "extensions", "folders": []}' > scan-results/scan-result.json
            fi
            for folder in "${folders[@]}"; do
              name=$(basename "$folder")
              echo "::group::Security scan: $name"
              python scripts/security_scan.py "$folder" \
                --out "scan-results/folder-${name}.json" \
                --summary "scan-results/folder-${name}.md"
              CODE=$?
              if [ $CODE -ne 0 ]; then STATUS="Failed"; fi
              if [ -f "scan-results/folder-${name}.md" ]; then
                cat "scan-results/folder-${name}.md" >> "$GITHUB_STEP_SUMMARY"
              fi
              echo "::endgroup::"
            done
            python - "$STATUS" <<'PY'
          import glob, json, sys
          status = sys.argv[1]
          entries = []
          for path in sorted(glob.glob("scan-results/folder-*.json")):
              try:
                  data = json.load(open(path, encoding="utf-8"))
              except Exception:
                  entries.append({"folder": path, "status": "Unknown"})
                  continue
              entries.append({"folder": data.get("target", path),
                              "status": data.get("status")})
              if data.get("status") == "Warning" and status == "Passed":
                  status = "Warning"
          json.dump({"status": status, "target": "extensions", "folders": entries},
                    open("scan-results/scan-result.json", "w", encoding="utf-8"),
                    indent=2, ensure_ascii=False)
          open("scan-results/status.txt", "w").write(status)
          PY
            STATUS=$(cat scan-results/status.txt)
          fi
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "scan target: $TARGET -> $STATUS" >> "$GITHUB_STEP_SUMMARY"

      - name: Append scan summary to job summary
        if: always()
        run: |
          if [ -f scan-results/scan-summary.md ]; then
            cat scan-results/scan-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit scan result (app reads this for status/progress)
        if: always() && github.event.inputs.ext_id != ''
        run: |
          EXT_ID="${{ github.event.inputs.ext_id }}"
          VERSION="${{ github.event.inputs.version }}"
          STATUS="${{ steps.scan.outputs.status }}"
          git config user.name "mobilestudio-scan-bot"
          git config user.email "mobilestudio-scan-bot@users.noreply.github.com"
          git pull --rebase origin main || true
          mkdir -p "scan-results/$EXT_ID"
          cp scan-results/scan-result.json "scan-results/$EXT_ID/$VERSION.json"
          python - "$EXT_ID" "$VERSION" "$STATUS" <<'EOF'
          import json, sys, os
          ext_id, version, status = sys.argv[1], sys.argv[2], sys.argv[3]
          q = {"extensions": [], "maxConcurrent": 5, "note": "FIFO queue state"}
          if os.path.isfile("queue.json"):
              try: q = json.load(open("queue.json", encoding="utf-8-sig"))
              except Exception: pass
          entry = {"id": ext_id, "version": version, "status": status,
                   "scannedAt": __import__("datetime").datetime.utcnow().isoformat() + "Z"}
          exts = [e for e in q.get("extensions", []) if e.get("id") != ext_id]
          exts.append(entry)
          q["extensions"] = exts
          json.dump(q, open("queue.json", "w", encoding="utf-8"), indent=2, ensure_ascii=False)
          EOF
          git add "scan-results/$EXT_ID/$VERSION.json" queue.json
          git commit -m "Scan result: $EXT_ID v$VERSION → $STATUS" || echo "nothing to commit"
          git push origin main || echo "push failed (will retry on next scan)"

      - name: Fail the job when the scan failed (blocks publish)
        if: always()
        run: |
          if [ "${{ steps.scan.outputs.status }}" = "Failed" ]; then
            echo "### ❌ Scan FAILED — package must NOT be published or downloaded." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
